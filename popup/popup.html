<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F1 Telemetry HUD Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <span class="f1-stripe"></span>
        <div class="title-group">
          <h1>F1 TELEMETRY</h1>
          <span class="sub">FanCode Live HUD</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-hud" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <!-- Session & Upcoming Event Card -->
    <div class="session-card" id="event-card">
      <div class="session-header-row">
        <span class="status-pill upcoming" id="event-status-pill">UPCOMING</span>
        <span class="session-country" id="event-country">United States</span>
      </div>
      <div class="session-title" id="session-title">Connecting to OpenF1...</div>

      <!-- Countdown Box -->
      <div class="countdown-box" id="countdown-box">
        <div class="countdown-label" id="countdown-label">STARTS IN:</div>
        <div class="countdown-digits" id="countdown-digits">--h --m --s</div>
      </div>

      <div class="session-meta" id="session-meta">Fetching schedule...</div>

      <!-- Expandable Weekend Schedule Accordion -->
      <button class="schedule-toggle-btn" id="btn-toggle-schedule" type="button">
        <span>📅 Weekend Schedule (5 Events)</span>
        <span class="accordion-arrow" id="accordion-arrow">▼</span>
      </button>

      <div class="schedule-list" id="schedule-list" style="display: none;"></div>
    </div>

    <!-- Active Driver 1 -->
    <div class="section-title">PRIMARY DRIVER</div>
    <div class="driver-select-container">
      <select id="driver-select">
        <option value="">Loading drivers...</option>
      </select>
    </div>

    <!-- Dual Driver Comparison Mode -->
    <div class="section-title">
      <span>DUAL DRIVER COMPARISON</span>
      <span class="offset-badge" id="compare-badge">OFF</span>
    </div>
    <div class="driver-select-container" style="margin-bottom: 8px;">
      <select id="compare-driver-select">
        <option value="">Select 2nd driver to compare...</option>
      </select>
    </div>
    <button class="action-btn" id="btn-toggle-compare" style="margin-bottom: 14px; background: rgba(255, 145, 0, 0.15); border-color: rgba(255, 145, 0, 0.4); color: #ff9100; font-weight: 800;">
      ⚔️ Toggle Dual HUD Comparison
    </button>

    <!-- Stream Delay Sync Offset -->
    <div class="section-title">
      <span>FANCODE SYNC OFFSET</span>
      <span class="offset-badge" id="offset-display">0s</span>
    </div>
    <div class="sync-controls">
      <button class="nudge-btn" id="btn-sub-5">-5s</button>
      <button class="nudge-btn" id="btn-sub-1">-1s</button>
      <input type="range" id="sync-slider" min="-60" max="60" value="0" step="1">
      <button class="nudge-btn" id="btn-add-1">+1s</button>
      <button class="nudge-btn" id="btn-add-5">+5s</button>
    </div>
    <div class="hint">Adjust if FanCode broadcast is delayed behind track timing.</div>

    <!-- Dock Presets -->
    <div class="section-title">HUD SCREEN POSITION</div>
    <div class="dock-grid">
      <button class="dock-btn" data-pos="pos-top-left">Top Left</button>
      <button class="dock-btn" data-pos="pos-top-center">Top Mid</button>
      <button class="dock-btn active" data-pos="pos-top-right">Top Right</button>
      <button class="dock-btn" data-pos="pos-bottom-left">Bottom Left</button>
      <button class="dock-btn" data-pos="pos-bottom-right">Bottom Right</button>
    </div>

    <!-- Actions / Links -->
    <footer class="popup-footer">
      <button class="action-btn" id="btn-open-demo">Launch Interactive Demo</button>
    </footer>
  </div>

  <script src="../content/openf1.js"></script>
  <script src="popup.js"></script>
</body>
</html>
